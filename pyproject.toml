[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swizzle-robotics"
version = "0.3.0"
description = "Real-time robotics VLA world models, Swizzle-CBF safety shield, RTC, MuJoCo arena, and binary MCAP recorder"
readme = "README.md"
authors = [{ name = "Paramveer singh", email = "paramveer@swizzle.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0"
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0"
]
sim = [
    "mujoco>=3.1.0"
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0"
]
test = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0"
]

[project.scripts]
swizzle-robotics = "swizzle_robotics.cli:main"
swizzle-robotics-server = "swizzle_robotics.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["swizzle_robotics*"]
